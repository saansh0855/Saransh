name: Build Android APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android project
        run: |
          if [ ! -f "gradlew" ]; then
            echo "::error::Gradle wrapper not found in repository root."
            echo "Make sure gradlew is committed to GitHub."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found in repository root."
            exit 1
          fi

          chmod +x gradlew

      - name: Show Java version
        run: java -version

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find generated APK
        id: find-apk
        shell: bash
        run: |
          APK_PATH="$(find . -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -not -path '*/build/outputs/apk/*/androidTest/*' \
            | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7
